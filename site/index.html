<div class="splash" id="splash" aria-label="SONEXA — Padho kahin bhi, par khud ko dekho yahin" role="img" title="Tap to skip">
  <div class="splash-inner">
    <img class="splash-logo" src="assets/logo.svg?v=sx3" alt="Sonexa" width="629" height="199" decoding="sync" fetchpriority="high">
    <p class="splash-tag">Padho kahin bhi, par khud ko dekho yahin</p>
  </div>
</div>
<script>
/* Intro splash: shown on EVERY load (no storage check). CSS fades it out by itself (~2 s, ~1.1 s with reduced motion);
   this only lets a tap/key skip it and removes it from the page afterwards. The app routes underneath, so #/deep-links land after it. */
(function(){var s=document.getElementById('splash');if(!s)return;var done=false,until=0;
function gone(){if(done)return;done=true;s.classList.add('is-gone');s.setAttribute('aria-hidden','true');}
/* swallow the ghost click a phone fires after the skipping tap, so it can't open whatever sits under the splash */
document.addEventListener('click',function(e){if(Date.now()<until){e.preventDefault();e.stopPropagation();}},true);
function skip(e){if(e&&e.cancelable)e.preventDefault();if(done||s.classList.contains('is-leaving'))return;until=Date.now()+700;s.classList.add('is-leaving');setTimeout(gone,450);}
s.addEventListener('animationend',function(e){if(e.target===s&&e.animationName==='splash-out'&&!s.classList.contains('is-leaving'))gone();});
s.addEventListener('pointerdown',skip);s.addEventListener('touchstart',skip,{passive:false});s.addEventListener('click',skip);
document.addEventListener('keydown',function k(e){if(!done)skip(e);document.removeEventListener('keydown',k);});
setTimeout(gone,3500);})();
</script>
